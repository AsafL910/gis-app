services:
  map-provider-ui:
    build: ./map-provider-ui
    container_name: map_provider_ui
    ports:
      - "8013:80"
    depends_on:
      - map-provider
      - map-manager
      - height-server
      - data-http

  data-http:
    image: nginx:alpine
    container_name: data_http
    ports:
      - "8011:80"
    volumes:
      - ./data:/usr/share/nginx/html:ro
      - ./data-http/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  height-server:
    build: ./height-server
    container_name: height_server
    ports:
      - "8009:8001"
    volumes:
      - ./height-server/src:/app/src  # hot-reload support
      - ./data:/data                  # shared read/write data volume
    environment:
      DATA_DIR: /data
      ELEV_FILENAME: dtm/israel_merged.vrt
      TOP_ELEV_FILENAME: israel_top_cog.tif
      BOTTOM_ELEV_FILENAME: israel_bottom_cog.tif
    command: pixi run start

  map-manager:
    build: ./map-manager
    container_name: map_manager
    ports:
      - "8008:8002"
    volumes:
      - ./map-manager/src:/app/src
      - ./data:/data
    environment:
      DATA_DIR: /data
      PORT: 8002

  map-provider:
    build: ./map-provider
    container_name: map_provider
    ports:
      - "8010:8000"
    volumes:
      - ./map-provider/src:/app/src   # hot-reload support
      - ./data:/data                  # same shared data volume (read-only for now)
    environment:
      DATA_DIR: /data
    command: pixi run start

  mapproxy-service:
    build: ./mapproxy-service
    container_name: mapproxy_service
    ports:
      - "8070:8070"
    volumes:
      - ./mapproxy-service/src:/app/src
      - ./data:/data
    environment:
      SERVICE_CONFIG_PATH: /data/config/mapproxy-service/config.json
    command: pixi run start
